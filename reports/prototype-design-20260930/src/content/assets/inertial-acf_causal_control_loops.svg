<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="acf_causal_control_loops-title acf_causal_control_loops-desc">
  <title id="acf_causal_control_loops-title">Two loops, two time scales</title>
  <desc id="acf_causal_control_loops-desc">A 10 kHz force loop subtracts target from reconstructed normal force. A PI correction opposes that error and is combined with causal measured-inertia, gravity, drag and lower-link-inverse feedforward. Current dynamics and actuator limits are retained. A 100 Hz robot loop recenters stroke only after a force-stability dwell, with a delay-aware gain cap. Commands already sent remain in the robot queue and predictor when the gate closes.</desc>
