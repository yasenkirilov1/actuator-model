  <text x="48" y="62" fill="#182b49" font-size="34" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start" xml:space="preserve">Two loops, two time scales</text>
  <text x="48" y="99" fill="#52647c" font-size="20" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">Fast force regulation, slow gated recentering and a causal robot predictor</text>
