<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="555" viewBox="0 0 1240 555" role="img" aria-labelledby="title desc"><title id="title">Spring-driven screw prototype and one-axis force reconstruction</title><desc id="desc">Robot R, prescribed undamped20N/mm upper spring, body A, internal series-elastic screw, B holder, finite-stiffness cell and S tool with a77mm by5mm pad. Tared cell force plus S inertia reconstruct total axial force. Unknown surface-normal and drag separation are deferred.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#50677a" /></marker></defs><rect width="1240" height="555" fill="#ffffff" /><g font-family="Inter,DejaVu Sans,Arial,sans-serif"><text x="42" y="44" font-size="26" fill="#24374b" font-weight="700" text-anchor="start">Prescribed mechanics with the spring-driven screw</text><text x="42" y="75" font-size="16" fill="#526578" font-weight="400" text-anchor="start">Prototype assumption: neglect sanding drag coupled into the force axis.</text><rect x="42" y="116" width="105" height="110" rx="12" fill="#edf2f7" stroke="#8297ab" stroke-width="2" /><text x="94.5" y="147" font-size="18" fill="#24374b" font-weight="650" text-anchor="middle">Robot R</text><text x="94.5" y="173" font-size="13" fill="#24374b" font-weight="400" text-anchor="middle">Issued motion</text><rect x="180" y="116" width="182" height="110" rx="12" fill="#ddf3ed" stroke="#328b78" stroke-width="2" /><text x="271.0" y="147" font-size="18" fill="#24374b" font-weight="650" text-anchor="middle">Upper spring</text><text x="271.0" y="173" font-size="13" fill="#24374b" font-weight="400" text-anchor="middle">20 N/mm; damping = 0</text><text x="271.0" y="193" font-size="13" fill="#24374b" font-weight="400" text-anchor="middle">Ideal unlimited travel</text><rect x="394" y="116" width="105" height="110" rx="12" fill="#edf2f7" stroke="#8297ab" stroke-width="2" /><text x="446.5" y="147" font-size="18" fill="#24374b" font-weight="650" text-anchor="middle">Body A</text><text x="446.5" y="173" font-size="13" fill="#24374b" font-weight="400" text-anchor="middle">1.5 kg</text><rect x="532" y="116" width="156" height="110" rx="12" fill="#e4eefb" stroke="#4875b4" stroke-width="2" /><text x="610.0" y="147" font-size="18" fill="#24374b" font-weight="650" text-anchor="middle">Screw + spring</text><text x="610.0" y="173" font-size="11.5" fill="#24374b" font-weight="400" text-anchor="middle">Independent nut + encoder</text><text x="610.0" y="193" font-size="11.5" fill="#24374b" font-weight="400" text-anchor="middle">Internal spring: 5 N/mm</text><rect x="721" y="116" width="105" height="110" rx="12" fill="#edf2f7" stroke="#8297ab" stroke-width="2" /><text x="773.5" y="147" font-size="18" fill="#24374b" font-weight="650" text-anchor="middle">Holder B</text><text x="773.5" y="173" font-size="13" fill="#24374b" font-weight="400" text-anchor="middle">0.6 kg</text><rect x="859" y="116" width="178" height="110" rx="12" fill="#f4e8f5" stroke="#a36aab" stroke-width="2" /><text x="948.0" y="147" font-size="18" fill="#24374b" font-weight="650" text-anchor="middle">Rigid connection</text><text x="948.0" y="173" font-size="13" fill="#24374b" font-weight="400" text-anchor="middle">One-axis load cell</text><text x="948.0" y="193" font-size="13" fill="#24374b" font-weight="400" text-anchor="middle">Finite stiffness retained</text><rect x="1070" y="116" width="125" height="110" rx="12" fill="#fff1d4" stroke="#ad8c3c" stroke-width="2" /><text x="1132.5" y="147" font-size="18" fill="#24374b" font-weight="650" text-anchor="middle">Tool S</text><text x="1132.5" y="173" font-size="13" fill="#24374b" font-weight="400" text-anchor="middle">0.1–2 kg</text><path d="M147 170 L180 170" fill="none" stroke="#50677a" stroke-width="2.3" marker-end="url(#arrow)" /><path d="M362 170 L394 170" fill="none" stroke="#50677a" stroke-width="2.3" marker-end="url(#arrow)" /><path d="M499 170 L532 170" fill="none" stroke="#50677a" stroke-width="2.3" marker-end="url(#arrow)" /><path d="M688 170 L721 170" fill="none" stroke="#50677a" stroke-width="2.3" marker-end="url(#arrow)" /><path d="M826 170 L859 170" fill="none" stroke="#50677a" stroke-width="2.3" marker-end="url(#arrow)" /><path d="M1037 170 L1070 170" fill="none" stroke="#50677a" stroke-width="2.3" marker-end="url(#arrow)" /><path d="M446 230 L446 277 L1212 277 L1212 170 L1195 170" fill="none" stroke="#4875b4" stroke-width="2" /><text x="790" y="301" font-size="15" fill="#4875b4" font-weight="400" text-anchor="middle">Measure tool position S relative to body A</text><rect x="42" y="327" width="1153" height="138" rx="14" fill="#f6f8fb" stroke="#d5dfe8" /><text x="65" y="356" font-size="18" fill="#24374b" font-weight="650" text-anchor="start">Force reconstruction with drag coupling neglected</text><rect x="65" y="374" width="220" height="67" rx="12" fill="#ffffff" stroke="#a36aab" stroke-width="2" /><text x="175.0" y="405" font-size="18" fill="#24374b" font-weight="650" text-anchor="middle">Tared B–S force</text><rect x="352" y="374" width="295" height="67" rx="12" fill="#ffffff" stroke="#328b78" stroke-width="2" /><text x="499.5" y="405" font-size="16" fill="#24374b" font-weight="650" text-anchor="middle">Add S mass × S acceleration</text><rect x="714" y="374" width="292" height="67" rx="12" fill="#ffffff" stroke="#4875b4" stroke-width="2" /><text x="860.0" y="405" font-size="16" fill="#24374b" font-weight="650" text-anchor="middle">Total axial contact force</text><path d="M285 407 L352 407" fill="none" stroke="#50677a" stroke-width="2.3" marker-end="url(#arrow)" /><path d="M647 407 L714 407" fill="none" stroke="#50677a" stroke-width="2.3" marker-end="url(#arrow)" /><path d="M1006 407 L1170 407" fill="none" stroke="#50677a" stroke-width="2.3" marker-end="url(#arrow)" /><text x="1107" y="396" font-size="15" fill="#24374b" font-weight="600" text-anchor="middle">Force feedback</text><text x="42" y="498" font-size="14" fill="#526578" font-weight="400" text-anchor="start">Force and S acceleration must describe the same instant. The pad is 77 mm diameter × 5 mm thick.</text><text x="42" y="524" font-size="14" fill="#526578" font-weight="400" text-anchor="start">Separating unknown sanding drag on slopes is deferred; that extension needs additional force axes.</text><text x="1132.5" y="193" text-anchor="middle" font-size="11" fill="#24374b">Accelerometer on S</text><rect x="1070" y="241" width="125" height="28" rx="4" fill="#ddf3ed" stroke="#328b78" stroke-width="2" /><text x="1132.5" y="260" text-anchor="middle" font-size="13" fill="#24374b">Soft pad · 5 mm</text><path d="M1132 226 L1132 241" stroke="#50677a" stroke-width="2" /><rect x="1055" y="304" width="150" height="9" fill="#8297ab" /><text x="1045" y="312" text-anchor="end" font-size="12" fill="#526578">Workpiece</text><path d="M1132 269 L1132 304" stroke="#50677a" stroke-width="1.5" /></g></svg>