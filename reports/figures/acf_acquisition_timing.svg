  <rect x="820" y="199" width="5" height="151" fill="#285cc5" stroke="none" stroke-width="1.8" rx="2" />
  <text x="842" y="220" fill="#285cc5" font-size="23" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start" xml:space="preserve">ADS131M08</text>
  <text x="842" y="252" fill="#52647c" font-size="17" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">30 ksample/s per channel</text>
  <text x="842" y="280" fill="#52647c" font-size="17" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">Simultaneous · Sinc³ · OSR128</text>
  <text x="842" y="308" fill="#52647c" font-size="17" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">49.6 µs group delay</text>
  <text x="842" y="336" fill="#52647c" font-size="17" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">Own ADC noise + quantization</text>
  <rect x="820" y="467" width="325" height="133" fill="#eef3fe" stroke="#285cc5" stroke-width="1.8" rx="14" />
  <rect x="820" y="480" width="5" height="107" fill="#285cc5" stroke="none" stroke-width="1.8" rx="2" />
  <text x="842" y="501" fill="#285cc5" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start" xml:space="preserve">Digital smoothing</text>
  <text x="842" y="533.0" fill="#52647c" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">EMA setting: 50 µs</text>
  <text x="842" y="559.5" fill="#52647c" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">At 30 ksample/s: 35.2 µs DC delay</text>
  <text x="842" y="586.0" fill="#52647c" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">Filter samples on the ADC clock.</text>
  <rect x="425" y="467" width="325" height="133" fill="#eef3fe" stroke="#285cc5" stroke-width="1.8" rx="14" />
  <rect x="425" y="480" width="5" height="107" fill="#285cc5" stroke="none" stroke-width="1.8" rx="2" />
  <text x="447" y="501" fill="#285cc5" font-size="22" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start" xml:space="preserve">Readout + MCU</text>
  <text x="447" y="533.0" fill="#52647c" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">20 µs total pipeline allowance</text>
  <text x="447" y="559.5" fill="#52647c" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">SPI: 15.625 µs, included above</text>
