  <text x="72" y="193" fill="#ae3f70" font-size="23" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="start" xml:space="preserve">Force channels</text>
  <text x="72" y="225" fill="#52647c" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">Cell + instrumentation amp</text>
