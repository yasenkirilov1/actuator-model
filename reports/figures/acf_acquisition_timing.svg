  <text x="432" y="225" fill="#52647c" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">About 8 kHz complete response</text>
  <text x="432" y="253" fill="#52647c" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">Include the sensor’s own phase.</text>
  <text x="432" y="281" fill="#52647c" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">Conditioning + analog rejection</text>
  <text x="432" y="309" fill="#52647c" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">Match axes after assembly.</text>
  <text x="432" y="337" fill="#52647c" font-size="18" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">28.1 µs nominal DC delay</text>
