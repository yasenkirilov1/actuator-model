<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="acf_acquisition_timing-title acf_acquisition_timing-desc">
  <title id="acf_acquisition_timing-title">Acquisition: response, sampling and time</title>
  <desc id="acf_acquisition_timing-desc">Force and analog S acceleration have matched complete response envelopes around 8 kHz. The ADS131M08 samples simultaneous channels at 30 ksample/s with Sinc cubed OSR128. A 50 microsecond EMA setting at this clock gives about 35.2 microseconds DC delay. The total 20 microsecond readout and MCU pipeline includes SPI. A fresh 10 kHz controller latch follows. Position uses a separately timestamped encoder. The nominal component low-frequency delays total 132.9 microseconds before sample-age and latch effects.</desc>
