  <text x="72" y="559.5" fill="#52647c" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">100 µs controller interval</text>
  <text x="72" y="586.0" fill="#52647c" font-size="16" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">Align estimated normal.</text>
