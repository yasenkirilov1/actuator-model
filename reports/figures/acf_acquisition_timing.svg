  <text x="1062.6072234762978" y="815" fill="#9a5b0a" font-size="23" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="middle" xml:space="preserve">20.0 µs</text>
  <text x="52" y="872" fill="#182b49" font-size="19" font-family="DejaVu Sans, sans-serif" font-weight="normal" text-anchor="start" xml:space="preserve">About 132.9 µs before sample-age / latch effects. Complete filter phase depends on frequency.</text>
