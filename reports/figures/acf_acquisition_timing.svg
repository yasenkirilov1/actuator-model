      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ae3f70" />
    </marker>
    <marker id="arrow-52647c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#52647c" />
    </marker>
  </defs>
