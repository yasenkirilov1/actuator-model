  <text x="485.8577878103838" y="815" fill="#285cc5" font-size="23" font-family="DejaVu Sans, sans-serif" font-weight="bold" text-anchor="middle" xml:space="preserve">49.6 µs</text>
  <rect x="690.1918735891647" y="759" width="290.02257336343115" height="72" fill="#f3eef9" stroke="#7750af" stroke-width="1" rx="0" />
