  <g id="text_22">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23343e" x="67.32" y="28.289344" transform="rotate(-0 67.32 28.289344)">The budget controller is sensitive to response time</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23343e" x="67.32" y="38.6496" transform="rotate(-0 67.32 38.6496)">Same 28 development cases and locked policy weights. No retraining, case exclusion or final-test outcomes.</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #23343e" transform="translate(67.32 375.192)">Pass requires completing the episode and keeping every scored force sample within ±0.5 N. Hatched bars include physical travel failures.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #23343e" transform="translate(67.32 388.692)">The 100 µs-current learned worst case has zero voltage clipping: more supply headroom does not address that recorded response limitation.</text>
  </g>
  <g id="text_25">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #627581" transform="translate(67.32 407.536)">The delay perturbation is known and matched in the model; actual and identified calibration residuals remain separate.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #627581" transform="translate(67.32 419.436)">Primary-chain reference records are reused; the two new comparisons add 112 scored episodes and two native recovery replays.</text>
  </g>
